name: Colectare art. 33 (semestrial)

# Instituțiile publice își publică listele de salarii pe 31 martie și 30 septembrie (art. 33
# din Legea 153/2017). În primele zile din aprilie și octombrie: descoperirea fișierelor noi
# pentru toate sursele din colectare/art33/surse.json, citirea lor (poarta de calitate lasă pe
# dinafară ce nu se citește sigur), apoi salariul-concluzie, publicat numai dacă trec testele.
on:
  schedule:
    - cron: "17 5 2-12 4,10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colectare
  cancel-in-progress: false

jobs:
  art33:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/colectare/art33/descopera.mjs --toate
      - run: node scripts/colectare/art33/colecteaza.mjs
      - name: Salariul-concluzie
        run: |
          npx tsx scripts/colectare/agregare.mjs
          node scripts/colectare/publica.mjs
          npm test
      - name: Salvează
        run: |
          git config user.name "salariile-colectare"
          git config user.email "colectare@users.noreply.github.com"
          git add colectare src/data/salariu-concluzie.json
          if git diff --cached --quiet; then echo "Nimic nou"; exit 0; fi
          git commit -m "Colectare art. 33 $(TZ=Europe/Bucharest date +%F): liste noi și salariul-concluzie"
          git pull --rebase origin main
          git push origin HEAD:main
