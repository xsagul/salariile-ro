name: CI

on:
  push:
  pull_request:
  # Site static: pagina de zile lucrătoare își calculează luna curentă la build.
  # Rebuild zilnic, ca luna să treacă singură fără commit.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:rendered

      # Publicarea este gestionată separat de Cloudflare Workers Builds, care
      # urmărește branch-ul main și rulează build-ul/deploy-ul cu tokenul propriu.
