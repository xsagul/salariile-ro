name: IndexNow (pagini schimbate)

# După fiecare publicare, anunță Bing paginile al căror text s-a schimbat
# (scripts/indexnow-schimbari.mjs). Bing alimentează și căutarea din ChatGPT și
# Copilot. Rularea zilnică prinde datele publicate de colectări, ale căror
# commituri făcute cu GITHUB_TOKEN nu pornesc workflow-uri.

on:
  push:
    branches: [main]
    paths-ignore:
      - "PROGRES.md"
      - "CLAUDE.md"
      - "docs/**"
      - "research/**"
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anunta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Starea de la rularea trecută
        uses: actions/cache/restore@v4
        with:
          path: indexnow-stare.json
          key: indexnow-stare-${{ github.run_id }}
          restore-keys: indexnow-stare-

      - name: Anunță paginile schimbate
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/indexnow-schimbari.mjs --stare indexnow-stare.json --asteapta "${{ github.sha }}"
          else
            node scripts/indexnow-schimbari.mjs --stare indexnow-stare.json
          fi

      - name: Salvează starea
        if: always() && hashFiles('indexnow-stare.json') != ''
        uses: actions/cache/save@v4
        with:
          path: indexnow-stare.json
          key: indexnow-stare-${{ github.run_id }}
