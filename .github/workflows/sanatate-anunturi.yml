name: Sănătatea hubului de anunțuri

# Paginile de anunțuri sunt făcute de Worker la fiecare cerere, din ce scriu oamenii în formular.
# Un text neașteptat poate strica pagina servită fără să pice vreun test (10–12 noiembrie 2026:
# lista națională goală două zile). scripts/anunturi/sanatate.mjs citește paginile publicate; dacă
# una e tăiată sau goală, rularea pică și GitHub trimite email.
#
# De patru ori pe zi: ~15 cereri pe rulare, din 100.000 de invocări gratuite pe zi.

on:
  schedule:
    - cron: "23 4,10,16,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/anunturi/sanatate.mjs
