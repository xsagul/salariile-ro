name: Colectare zilnică

# Colectare continuă din mai multe surse (decizia proprietarului, 26 septembrie 2026;
# CLAUDE.md). Zilnic: ofertele noi ANOFM, apoi salariul-concluzie recalculat și publicat numai
# dacă trec testele. Commit-ul are [skip ci] când s-au schimbat doar datele brute; când se
# schimbă cifrele publicate, rulează CI-ul, iar Cloudflare publică site-ul.
on:
  schedule:
    - cron: "41 4 * * *" # 07:41 ora României (vara)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colectare
  cancel-in-progress: false

jobs:
  anofm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/colectare/anofm.mjs
      - run: node scripts/colectare/angajatori.mjs
      - run: npm ci
      - name: Salariul-concluzie
        run: |
          npx tsx scripts/colectare/agregare.mjs
          node scripts/colectare/publica.mjs
          npm test
      - name: Salvează ziua
        run: |
          git config user.name "salariile-colectare"
          git config user.email "colectare@users.noreply.github.com"
          git add colectare src/data/salariu-concluzie.json
          if git diff --cached --quiet; then echo "Nimic nou"; exit 0; fi
          ZI=$(TZ=Europe/Bucharest date +%F)
          if git diff --cached --quiet -- src/data/salariu-concluzie.json; then
            git commit -m "Colectare ANOFM $ZI [skip ci]"
          else
            git commit -m "Colectare ANOFM $ZI: salariul-concluzie actualizat"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
